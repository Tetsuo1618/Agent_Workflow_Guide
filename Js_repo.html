<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JavaScript Core Building Blocks – Curriculum</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #252840;
    --accent: #f7df1e;
    --accent2: #61dafb;
    --text: #e8eaf6;
    --muted: #8b8fa8;
    --green: #4ade80;
    --radius: 12px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a1d2e 0%, #0f1117 100%);
    border-bottom: 2px solid var(--accent);
    padding: 28px 32px 20px;
  }
  .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .js-badge {
    background: var(--accent); color: #000; font-weight: 900;
    font-size: 18px; width: 44px; height: 44px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 14px; margin-left: 58px; }

  .progress-bar-wrap {
    margin: 20px 32px 0;
    background: var(--surface2); border-radius: 99px; height: 10px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px; transition: width 0.5s ease;
  }
  .progress-label { color: var(--muted); font-size: 12px; margin: 8px 32px 0; }

  main { padding: 24px 32px; max-width: 860px; }

  .module {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid #2a2d44; margin-bottom: 16px; overflow: hidden;
  }
  .module-header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px; cursor: pointer; user-select: none;
    transition: background 0.2s;
  }
  .module-header:hover { background: var(--surface2); }
  .module-num {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface2);
    border: 2px solid var(--accent); color: var(--accent);
    font-weight: 700; font-size: 13px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .module-num.done { background: var(--accent); color: #000; border-color: var(--accent); }
  .module-title { flex: 1; }
  .module-title h2 { font-size: 16px; font-weight: 600; }
  .module-title .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chevron { color: var(--muted); font-size: 18px; transition: transform 0.3s; }
  .module.open .chevron { transform: rotate(180deg); }
  .module-progress { font-size: 12px; color: var(--accent2); font-weight: 600; margin-right: 8px; }

  .module-body { display: none; border-top: 1px solid #2a2d44; padding: 0 20px 16px; }
  .module.open .module-body { display: block; }

  .topic-list { list-style: none; margin-top: 14px; }
  .topic-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #1e2136;
  }
  .topic-item:last-child { border-bottom: none; }
  .check {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid #3a3d5a;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; margin-top: 2px; transition: all 0.2s;
  }
  .check.checked { background: var(--green); border-color: var(--green); }
  .check.checked::after { content: '✓'; color: #000; font-size: 12px; font-weight: 900; }
  .topic-content { flex: 1; }
  .topic-name { font-size: 14px; font-weight: 500; }
  .topic-name.done { text-decoration: line-through; color: var(--muted); }
  .topic-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: var(--surface2); color: var(--accent2);
  }
  .tag.project { color: var(--accent); }

  .project-box {
    margin-top: 16px; background: var(--surface2);
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    padding: 12px 16px;
  }
  .project-box .proj-label { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .project-box .proj-name { font-size: 14px; font-weight: 600; margin-top: 4px; }
  .project-box .proj-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  .reset-btn {
    margin: 8px 32px 24px; background: none; border: 1px solid #3a3d5a;
    color: var(--muted); font-size: 12px; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="js-badge">JS</div>
    <h1>Core Building Blocks of JavaScript</h1>
  </div>
  <div class="subtitle">Self-paced curriculum · Some coding experience · 6 modules</div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">0 of 30 topics completed</div>
</header>

<main id="mainContent"></main>
<button class="reset-btn" onclick="resetAll()">↺ Reset progress</button>

<script>
const curriculum = [
  {
    title: "Variables, Types & Operators",
    time: "~3–4 hours",
    project: { name: "Personal Bio Card", desc: "Build a script that stores your name, age, hobbies in variables and logs a formatted introduction to the console." },
    topics: [
      { name: "var, let, const — when to use each", desc: "Understand scope and mutability differences. Prefer const by default, let when reassignment is needed.", tags: ["fundamentals"] },
      { name: "Primitive data types", desc: "string, number, boolean, null, undefined, Symbol — know what each holds and when to use them.", tags: ["fundamentals"] },
      { name: "Type coercion & typeof", desc: "JS silently converts types; learn where this bites you (== vs ===).", tags: ["gotcha"] },
      { name: "Arithmetic, comparison & logical operators", desc: "+, -, *, /, %, **, &&, ||, !, ternary. Build intuition for operator precedence.", tags: ["fundamentals"] },
      { name: "Template literals", desc: "Backtick strings with ${expression} interpolation — cleaner than string concatenation.", tags: ["syntax"] },
    ]
  },
  {
    title: "Control Flow",
    time: "~2–3 hours",
    project: { name: "Grade Calculator", desc: "Take a numeric score and output the letter grade using if/else chains and a switch statement." },
    topics: [
      { name: "if / else if / else", desc: "The backbone of decision-making. Focus on writing clear, readable conditions.", tags: ["fundamentals"] },
      { name: "switch statement", desc: "Cleaner than long if-chains when comparing one value to many cases.", tags: ["syntax"] },
      { name: "Truthy & falsy values", desc: "0, '', null, undefined, NaN, false are falsy — everything else is truthy. Critical for clean conditionals.", tags: ["gotcha"] },
      { name: "for, while, do…while loops", desc: "Know when to reach for each. for = known iterations; while = condition-based; do…while = run at least once.", tags: ["fundamentals"] },
      { name: "break & continue", desc: "Control loop flow — exit early or skip an iteration.", tags: ["syntax"] },
    ]
  },
  {
    title: "Functions",
    time: "~4–5 hours",
    project: { name: "Mini Utility Library", desc: "Write 5 reusable functions: capitalize a string, clamp a number, check if a number is even, reverse a string, compute factorial." },
    topics: [
      { name: "Function declarations vs expressions", desc: "Declarations are hoisted; expressions are not. Both are valid — understand the trade-offs.", tags: ["fundamentals"] },
      { name: "Arrow functions", desc: "Concise syntax — great for callbacks. Key difference: no own 'this' binding.", tags: ["modern JS"] },
      { name: "Parameters, arguments & default values", desc: "function greet(name = 'World') {} — defaults prevent undefined surprises.", tags: ["syntax"] },
      { name: "Return values", desc: "Functions return undefined unless you say otherwise. Every function should have a clear, predictable return.", tags: ["fundamentals"] },
      { name: "Scope & closures", desc: "Variables live in the scope they're created in. Closures let inner functions remember outer variables — powerful and tricky.", tags: ["advanced", "gotcha"] },
    ]
  },
  {
    title: "Arrays & Objects",
    time: "~4–5 hours",
    project: { name: "Task List Manager", desc: "Create an array of task objects {id, title, done}. Write functions to add, remove, toggle, and filter tasks." },
    topics: [
      { name: "Array creation & indexing", desc: "[], push, pop, shift, unshift, splice, slice — the manipulation toolkit.", tags: ["fundamentals"] },
      { name: "Array iteration methods", desc: "forEach, map, filter, reduce, find, some, every — these replace most for-loops in modern JS.", tags: ["modern JS"] },
      { name: "Object literals & property access", desc: "{ key: value } syntax, dot notation vs bracket notation, shorthand properties.", tags: ["fundamentals"] },
      { name: "Destructuring assignment", desc: "const { name, age } = person or const [first, second] = arr — cleaner than manual property access.", tags: ["modern JS"] },
      { name: "Spread & rest operators (...)", desc: "Copy arrays/objects, merge them, or collect remaining arguments. One of JS's most useful modern features.", tags: ["modern JS"] },
    ]
  },
  {
    title: "The DOM & Events",
    time: "~4–5 hours",
    project: { name: "Interactive Counter", desc: "Build a webpage with + / − buttons that update a displayed count. Style it and add a reset button." },
    topics: [
      { name: "What is the DOM?", desc: "The Document Object Model is JS's live interface to your HTML. Changes to it update the page in real time.", tags: ["browser"] },
      { name: "Selecting elements", desc: "querySelector, querySelectorAll, getElementById — use the first two for 95% of work.", tags: ["browser"] },
      { name: "Modifying elements", desc: "textContent, innerHTML, style, classList (add, remove, toggle) — how to change what users see.", tags: ["browser"] },
      { name: "Event listeners", desc: "addEventListener('click', handler) — the pattern for nearly all interactivity.", tags: ["browser", "fundamentals"] },
      { name: "Event object & bubbling", desc: "event.target, event.preventDefault(), and how events bubble up the DOM tree.", tags: ["browser", "gotcha"] },
    ]
  },
  {
    title: "Async JavaScript",
    time: "~4–5 hours",
    project: { name: "Public API Explorer", desc: "Fetch data from a free API (e.g. open-meteo weather or JSONPlaceholder), display results on a page, and handle loading/error states." },
    topics: [
      { name: "Synchronous vs asynchronous code", desc: "JS is single-threaded — async lets long operations (network, timers) run without blocking the UI.", tags: ["fundamentals"] },
      { name: "Callbacks & callback hell", desc: "The original async pattern and why nested callbacks become unmanageable — motivates Promises.", tags: ["history"] },
      { name: "Promises (.then / .catch / .finally)", desc: "A cleaner async contract. A Promise is pending → fulfilled or rejected.", tags: ["modern JS"] },
      { name: "async / await", desc: "Syntactic sugar over Promises that reads like synchronous code. The standard approach in modern JS.", tags: ["modern JS"] },
      { name: "fetch API & error handling", desc: "fetch returns a Promise. Always check response.ok and wrap in try/catch with async/await.", tags: ["browser", "modern JS"] },
    ]
  }
];

const STORAGE_KEY = 'js_curriculum_v1';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

function topicId(modIdx, topicIdx) { return `m${modIdx}t${topicIdx}`; }

function countCompleted() {
  return curriculum.reduce((total, mod, mi) =>
    total + mod.topics.filter((_, ti) => state[topicId(mi, ti)]).length, 0);
}

function totalTopics() {
  return curriculum.reduce((t, m) => t + m.topics.length, 0);
}

function updateProgress() {
  const done = countCompleted();
  const total = totalTopics();
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} of ${total} topics completed — ${pct}%`;
}

function toggleTopic(modIdx, topicIdx) {
  const id = topicId(modIdx, topicIdx);
  state[id] = !state[id];
  saveState(state);
  renderCheck(modIdx, topicIdx);
  renderModuleProgress(modIdx);
  updateProgress();
}

function renderCheck(mi, ti) {
  const id = topicId(mi, ti);
  const el = document.getElementById('check_' + id);
  const nameEl = document.getElementById('name_' + id);
  if (!el) return;
  el.classList.toggle('checked', !!state[id]);
  nameEl.classList.toggle('done', !!state[id]);
}

function renderModuleProgress(mi) {
  const done = curriculum[mi].topics.filter((_, ti) => state[topicId(mi, ti)]).length;
  const total = curriculum[mi].topics.length;
  const el = document.getElementById('modprog_' + mi);
  if (el) el.textContent = `${done}/${total}`;
  const numEl = document.getElementById('modnum_' + mi);
  if (numEl) numEl.classList.toggle('done', done === total);
}

function toggleModule(mi) {
  const el = document.getElementById('module_' + mi);
  el.classList.toggle('open');
}

function buildUI() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  curriculum.forEach((mod, mi) => {
    const div = document.createElement('div');
    div.className = 'module';
    div.id = 'module_' + mi;

    const doneTags = (tags) => tags.map(t => `<span class="tag ${t==='project'?'project':''}">${t}</span>`).join('');

    div.innerHTML = `
      <div class="module-header" onclick="toggleModule(${mi})">
        <div class="module-num" id="modnum_${mi}">${mi + 1}</div>
        <div class="module-title">
          <h2>${mod.title}</h2>
          <div class="meta">⏱ ${mod.time} &nbsp;·&nbsp; ${mod.topics.length} topics</div>
        </div>
        <span class="module-progress" id="modprog_${mi}">0/${mod.topics.length}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="module-body">
        <ul class="topic-list">
          ${mod.topics.map((t, ti) => `
            <li class="topic-item">
              <div class="check" id="check_${topicId(mi,ti)}" onclick="toggleTopic(${mi},${ti})"></div>
              <div class="topic-content">
                <div class="topic-name" id="name_${topicId(mi,ti)}">${t.name}</div>
                <div class="topic-desc">${t.desc}</div>
                <div class="tags">${doneTags(t.tags)}</div>
              </div>
            </li>`).join('')}
        </ul>
        <div class="project-box">
          <div class="proj-label">🛠 Mini Project</div>
          <div class="proj-name">${mod.project.name}</div>
          <div class="proj-desc">${mod.project.desc}</div>
        </div>
      </div>`;
    main.appendChild(div);
  });

  // Restore state
  curriculum.forEach((mod, mi) => {
    mod.topics.forEach((_, ti) => renderCheck(mi, ti));
    renderModuleProgress(mi);
  });
  updateProgress();
  // Open first module by default
  document.getElementById('module_0').classList.add('open');
}

function resetAll() {
  if (confirm('Reset all progress?')) {
    state = {};
    saveState(state);
    buildUI();
  }
}

buildUI();
</script>
</body>
</html>
